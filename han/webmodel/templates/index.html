<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입국자수 예측 프로그램</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR:400,700&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif !important;}
        #country-btn { background: #e0f7fa; color: #01579b; }
        #purpose-btn { background: #fff3e0; color: #e65100; }
        .scrollable-menu {max-height: 280px; overflow-y: auto;}
        .dropdown-menu {min-width: 100%;}
        #graph, #map-graph {border: 1px solid #ccc; border-radius: 8px; height: 550px !important;}
        .header-shadow {box-shadow:0 2px 8px #ececec;}
        .fs-5 { font-size: 1.25rem; }
        .fw-bold { font-weight: bold; }
        .plotly-selected-point { filter: brightness(1.5) drop-shadow(0px 0px 8px #fbe7a2);}
        #world-map {border: 1px solid #c8c8c8; border-radius: 6px; background: #f7fbff;}
        .tab-pane { padding-top: 10px;}
        #map-tooltip {
            position:absolute;pointer-events:none;z-index:9999;display:none;
            background:#222;color:#fff;padding:5px 15px;border-radius:8px;font-size:18px;opacity:.92;
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif !important;
        }
    </style>
</head>
<body>
<!-- 헤더 -->
<header class="p-3 bg-dark text-white mb-3 header-shadow">
    <div class="container"><h3 class="m-0">Precision Coach 갓갱 | 입국자수 예측 프로그램</h3></div>
</header>

<div class="container">
    <!-- 모드 탭 -->
    <ul class="nav nav-tabs mb-3" id="nationModeTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="menu-mode-tab" data-bs-toggle="tab" data-bs-target="#menu-mode-pane" type="button" role="tab">메뉴에서 선택</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="map-mode-tab" data-bs-toggle="tab" data-bs-target="#map-mode-pane" type="button" role="tab">세계지도에서 선택</button>
        </li>
    </ul>
    <div class="tab-content" id="nationModeTabContent">
        <!-- 1) 기존 메뉴 방식 -->
        <div class="tab-pane fade show active" id="menu-mode-pane" role="tabpanel">
            <div class="row mb-3">
                <!-- 국가 선택 -->
                <div class="col-md-2 position-relative">
                    <button class="btn w-100" id="country-btn" type="button">전체 <span class="caret"></span></button>
                    <ul class="dropdown-menu w-100 scrollable-menu" id="country-list" style="display:none;position:absolute;z-index:1000;"></ul>
                </div>
                <!-- 목적 선택 -->
                <div class="col-md-2 position-relative">
                    <button class="btn w-100" id="purpose-btn" type="button">전체 <span class="caret"></span></button>
                    <ul class="dropdown-menu w-100 scrollable-menu" id="purpose-list" style="display:none;position:absolute;z-index:1000;"></ul>
                </div>
                <!-- 기간 선택 -->
                <div class="col-md-6 d-flex align-items-center">
                    <select class="form-select w-auto me-1" id="start-year"></select>
                    <select class="form-select w-auto me-1" id="start-month"></select>
                    <span class="mx-1">~</span>
                    <select class="form-select w-auto me-1" id="end-year"></select>
                    <select class="form-select w-auto" id="end-month"></select>
                    <button class="btn btn-primary ms-3" id="search-btn">검색</button>
                </div>
            </div>
            <div class="mb-2 fs-5 fw-bold" id="search-title"></div>
            <div id="graph"></div>
        </div>
        <!-- 2) 지도 방식 -->
        <div class="tab-pane fade" id="map-mode-pane" role="tabpanel">
            <div id="world-map" style="width:100%;max-width:800px;height:480px;margin:auto;"></div>
            <div id="map-tooltip"></div>
            <div id="selected-country-info" class="mt-3" style="display:none;">
                <div class="mb-2 fw-bold">선택한 국가: <span id="selected-country-map"></span></div>
                <div class="row mb-3">
                    <div class="col-md-2"></div>
                    <div class="col-md-2 position-relative">
                        <!-- 목적 버튼 강조! -->
                        <button class="btn btn-lg w-100 fw-bold" id="map-purpose-btn" type="button"
                            style="background:#ffe082;color:#b26500;border:2px solid #ffb300;box-shadow:0 0 4px #ffe082;">
                            <i class="bi bi-flag-fill me-1"></i> <span id="map-purpose-label">전체</span> <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu w-100 scrollable-menu" id="map-purpose-list" style="display:none;position:absolute;z-index:1000;"></ul>
                    </div>
                    <div class="col-md-6 d-flex align-items-center">
                        <select class="form-select w-auto me-1" id="map-start-year"></select>
                        <select class="form-select w-auto me-1" id="map-start-month"></select>
                        <span class="mx-1">~</span>
                        <select class="form-select w-auto me-1" id="map-end-year"></select>
                        <select class="form-select w-auto" id="map-end-month"></select>
                        <button class="btn btn-primary ms-3" id="map-search-btn">검색</button>
                    </div>
                </div>
                <div class="mb-2 fs-5 fw-bold" id="map-search-title"></div>
                <div id="map-graph"></div>
            </div>
        </div>
    </div>
</div>

<!-- 풋터 -->
<footer class="p-3 bg-light text-center mt-4">임시 풋터: Precision Coach 갓갱</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --------- 공통 상태값 선언 ----------
    let selectedCountry = "전체";
    let selectedPurpose = "전체";
    let startYear = 2025, startMonth = 1, endYear = 2025, endMonth = 12;
    let selectedCountryIso = null, selectedCountryName = null;
    let selectedMapPurpose = "전체";
    let mapStartYear = 2025, mapStartMonth = 1, mapEndYear = 2025, mapEndMonth = 12;

    // --------- 국가, 목적 드롭다운 ----------
    function closeAllDropdown() {
        document.querySelectorAll('.dropdown-menu').forEach(el=>el.style.display='none');
    }
    document.body.onclick = closeAllDropdown;
    document.getElementById('country-btn').onclick = function(e){
        e.stopPropagation();
        let ul = document.getElementById('country-list');
        ul.style.display = ul.style.display=='block'?'none':'block';
        document.getElementById('purpose-list').style.display = 'none';
    }
    document.getElementById('purpose-btn').onclick = function(e){
        e.stopPropagation();
        let ul = document.getElementById('purpose-list');
        ul.style.display = ul.style.display=='block'?'none':'block';
        document.getElementById('country-list').style.display = 'none';
    }
    fetch('/api/countries').then(res=>res.json()).then(list=>{
        let ul = document.getElementById('country-list');
        ul.innerHTML = '';
        list.forEach(c=>{
            let li = document.createElement('li');
            li.className = 'dropdown-item';
            li.innerText = c;
            li.onclick = function(e){
                e.stopPropagation();
                selectedCountry = c;
                document.getElementById('country-btn').innerText = c;
                ul.style.display = 'none';
            }
            ul.appendChild(li);
        });
    });
    fetch('/api/purposes').then(res=>res.json()).then(list=>{
        let ul = document.getElementById('purpose-list');
        ul.innerHTML = '';
        list.forEach(p=>{
            let li = document.createElement('li');
            li.className = 'dropdown-item';
            li.innerText = p;
            li.onclick = function(e){
                e.stopPropagation();
                selectedPurpose = p;
                document.getElementById('purpose-btn').innerText = p;
                ul.style.display = 'none';
            }
            ul.appendChild(li);
        });
        // 지도 모드 목적도 공유
        let ul2 = document.getElementById('map-purpose-list');
        ul2.innerHTML = '';
        list.forEach(p=>{
            let li = document.createElement('li');
            li.className = 'dropdown-item';
            li.innerText = p;
            li.onclick = function(e){
                e.stopPropagation();
                selectedMapPurpose = p;
                document.getElementById('map-purpose-label').innerText = p;
                ul2.style.display = 'none';
            }
            ul2.appendChild(li);
        });
    });

    // --------- 기간 select 공통 함수 ----------
    function setSelectOptions(syid, smid, eyid, emid, y=2025, sm=1, ey=2025, em=12) {
        const years = [];
        for (let y = 2005; y <= 2026; y++) years.push(y);
        const months = [];
        for (let m = 1; m <= 12; m++) months.push(m);
        [syid, eyid].forEach(id => {
            let s = document.getElementById(id);
            s.innerHTML = '';
            years.forEach(y => {
                let opt = document.createElement('option');
                opt.value = y;
                opt.text = y + '년';
                s.appendChild(opt);
            });
        });
        [smid, emid].forEach(id => {
            let s = document.getElementById(id);
            s.innerHTML = '';
            months.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m;
                opt.text = m + '월';
                s.appendChild(opt);
            });
        });
        document.getElementById(syid).value = y;
        document.getElementById(smid).value = sm;
        document.getElementById(eyid).value = ey;
        document.getElementById(emid).value = em;
    }
    setSelectOptions('start-year','start-month','end-year','end-month');
    setSelectOptions('map-start-year','map-start-month','map-end-year','map-end-month');
    // 기간 onchange
    ['start-year','start-month','end-year','end-month'].forEach(id=>{
        document.getElementById(id).onchange = function(){
            startYear = parseInt(document.getElementById('start-year').value);
            startMonth = parseInt(document.getElementById('start-month').value);
            endYear = parseInt(document.getElementById('end-year').value);
            endMonth = parseInt(document.getElementById('end-month').value);
        }
    });
    ['map-start-year','map-start-month','map-end-year','map-end-month'].forEach(id=>{
        document.getElementById(id).onchange = function(){
            mapStartYear = parseInt(document.getElementById('map-start-year').value);
            mapStartMonth = parseInt(document.getElementById('map-start-month').value);
            mapEndYear = parseInt(document.getElementById('map-end-year').value);
            mapEndMonth = parseInt(document.getElementById('map-end-month').value);
        }
    });

    // --------- 검색 버튼 ----------
    function getMonthDiff(y1,m1,y2,m2){ return (y2-y1)*12+(m2-m1); }
    document.getElementById('search-btn').onclick = function(){
        let diff = getMonthDiff(startYear, startMonth, endYear, endMonth);
        if(diff<0) return alert('검색 시작월이 종료월보다 앞서야 합니다');
        if(diff>11) return alert('검색 기간은 최대 1년(12개월)만 가능합니다');
        let tit = `[국가] ${selectedCountry} | [목적] ${selectedPurpose} | [기간] ${startYear}년 ${startMonth}월 ~ ${endYear}년 ${endMonth}월`;
        document.getElementById('search-title').innerText = tit;
        let startYM = `${startYear}-${String(startMonth).padStart(2,'0')}`;
        let endYM = `${endYear}-${String(endMonth).padStart(2,'0')}`;
        drawGraph('graph', selectedCountry, selectedPurpose, startYM, endYM);
    };
    document.getElementById('map-purpose-btn').onclick = function(e){
        e.stopPropagation();
        let ul = document.getElementById('map-purpose-list');
        ul.style.display = ul.style.display=='block'?'none':'block';
    }
    document.getElementById('map-search-btn').onclick = function(){
        let diff = getMonthDiff(mapStartYear, mapStartMonth, mapEndYear, mapEndMonth);
        if(!selectedCountryName) return alert('국가를 지도에서 선택해 주세요');
        if(diff<0) return alert('검색 시작월이 종료월보다 앞서야 합니다');
        if(diff>11) return alert('검색 기간은 최대 1년(12개월)만 가능합니다');
        let tit = `[국가] ${selectedCountryName} | [목적] ${selectedMapPurpose} | [기간] ${mapStartYear}년 ${mapStartMonth}월 ~ ${mapEndYear}년 ${mapEndMonth}월`;
        document.getElementById('map-search-title').innerText = tit;
        let startYM = `${mapStartYear}-${String(mapStartMonth).padStart(2,'0')}`;
        let endYM = `${mapEndYear}-${String(mapEndMonth).padStart(2,'0')}`;
        drawGraph('map-graph', selectedCountryName, selectedMapPurpose, startYM, endYM);
    };

    // --------- 공통 그래프 그리기 함수 ----------
    function toKoMonth(x){
        let [yy, mm] = x.split('-');
        return `${yy}년 ${parseInt(mm)}월`;
    }
    function drawGraph(targetDiv, country, purpose, startYM, endYM) {
        fetch('/api/predict', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({country:country, purpose:purpose, start_ym:startYM, end_ym:endYM})
        }).then(res=>res.json()).then(data=>{
            let xRaw = data.yms, y = data.values, actual = data.is_actual;
            let xKo = xRaw.map(toKoMonth);
            let splitIdx = actual.lastIndexOf(true);
            let actualY = y.map((v,i)=> actual[i]?v:null);
            let predY = [];
            for(let i=0; i<xRaw.length; i++){
                if(i < splitIdx) predY.push(null);
                else if(i === splitIdx) predY.push(y[i]);
                else predY.push(y[i]);
            }
            function hovertemplateGen(){
                return '%{customdata} <br>%{y:,}명<extra></extra>';
            }
            let customdata = xKo;
            let gd = document.getElementById(targetDiv);
            Plotly.newPlot(gd, [
                {
                    x: xRaw, y: actualY, customdata: customdata,
                    mode: 'lines+markers',
                    name: '실제',
                    line: {color:'#2196f3',width:3,dash:'solid'},
                    marker: {color:'#2196f3', size: 12, line:{width:2, color:'#1565c0'}},
                    hoverlabel:{bgcolor:'#e3f2fd',font:{color:'#01579b',size:22}, bordercolor:'#1976d2'},
                    hovertemplate: hovertemplateGen()
                },
                {
                    x: xRaw, y: predY, customdata: customdata,
                    mode: 'lines+markers',
                    name: '예측',
                    line: {color:'#ff9800',width:3,dash:'dot'},
                    marker: {color:'#ff9800', size: 12, line:{width:2, color:'#ef6c00'}},
                    hoverlabel:{bgcolor:'#fff3e0',font:{color:'#e65100',size:22}, bordercolor:'#f57c00'},
                    hovertemplate: hovertemplateGen()
                }            ],{
                hovermode: 'closest',
                yaxis: { title: '입국자 수', rangemode:'tozero', automargin:true, tickformat:',d',
                    font:{family:'"Noto Sans KR", "Malgun Gothic", sans-serif'}
                },
                xaxis: { title: '월', tickangle: -30, tickvals: xRaw, ticktext: xKo, automargin:true,
                    font:{family:'"Noto Sans KR", "Malgun Gothic", sans-serif'}
                },
                margin: { t:30, b:80, l:60, r:10 },
                showlegend:true,
                font:{family:'"Noto Sans KR", "Malgun Gothic", sans-serif'}
            },{responsive:true});

            gd.on('plotly_hover', function(ev){
                let pn = ev.points[0].pointNumber;
                let curve = ev.points[0].curveNumber;
                let nodes = gd.querySelectorAll('.scatterlayer .trace');
                nodes.forEach((el,idx)=>{
                    el.classList.remove('plotly-selected-point');
                    if(idx===curve){
                        let mark = el.querySelectorAll('path.point');
                        if(mark[pn]) mark[pn].classList.add('plotly-selected-point');
                    }
                });
            });
            gd.on('plotly_unhover', function(){
                let nodes = gd.querySelectorAll('.scatterlayer .trace');
                nodes.forEach(el=>{
                    el.classList.remove('plotly-selected-point');
                    let marks = el.querySelectorAll('path.point');
                    marks.forEach(mk=>mk.classList.remove('plotly-selected-point'));
                });
            });
        });
    }

    // --------- 지도 (파란색/회색, 한글 안내만, 중앙 Plotly 라벨 제거) ---------
    // 예시: 실제 구현시 불가국가 ISO3 코드 더 추가 가능
    let modelAvailableCountries = ["KOR","JPN","USA","CHN"];
    let unavailableCountries = [
        "CAN","MEX","BRA","ARG","FRA","DEU","ITA","GBR","ESP","IND","AUS","RUS","TUR","EGY","ZAF","IDN"
    ];
    let allMapCountries = modelAvailableCountries.concat(unavailableCountries);

    let zValues = allMapCountries.map(iso =>
        modelAvailableCountries.includes(iso) ? 1 : 0
    );
    let colorScale = [
        [0, '#888888'], // 선택불가: 어두운 회색
        [0.99, '#888888'],
        [1, '#4ea7e8']  // 선택가능: 파란색
    ];

    function getKoreanCountryName(iso){
        const isoKo = { KOR:'대한민국', JPN:'일본', USA:'미국', CHN:'중국' };
        return isoKo[iso]||iso;
    }
    function renderWorldMap() {
        let mapDiv = document.getElementById('world-map');
        if(mapDiv.data) Plotly.purge(mapDiv);

        Plotly.newPlot(mapDiv, [{
            type: 'choropleth',
            locationmode: 'ISO-3',
            locations: allMapCountries,
            z: zValues,
            colorscale: colorScale,
            showscale: false,
            hovertemplate: '', // 중앙 Plotly 안내 제거
            text: allMapCountries.map(()=>''), // 중앙 Plotly 텍스트 제거
            texttemplate: '', // 중앙 Plotly 텍스트 제거
            marker: {line:{color:'#333',width:0.5}},
        }],{
            geo: { projection: {type:'robinson'}, showframe:false, showcoastlines:true, showcountries:true, countrycolor:'#666' },
            margin:{t:0,b:0,l:0,r:0}
        },{displayModeBar:false,responsive:true});

        let tooltip = document.getElementById('map-tooltip');
        mapDiv.on('plotly_hover', function(ev){
            let iso = ev.points[0].location;
            tooltip.innerText = getKoreanCountryName(iso);
            tooltip.style.display = 'block';
            let evt = ev.event || window.event;
            let px = evt.clientX, py = evt.clientY + window.scrollY;
            tooltip.style.left = (px+16) + 'px';
            tooltip.style.top = (py-10) + 'px';
            mapDiv.style.cursor = modelAvailableCountries.includes(iso) ? 'pointer' : 'not-allowed';
        });
        mapDiv.on('plotly_unhover', function(){
            tooltip.style.display = 'none';
            mapDiv.style.cursor = '';
        });
        mapDiv.on('plotly_click', function(ev){
            let iso = ev.points[0].location;
            if(!modelAvailableCountries.includes(iso)) {
                alert('이 국가는 예측이 불가합니다.');
                return;
            }
            selectedCountryIso = iso;
            selectedCountryName = getKoreanCountryName(iso);
            document.getElementById('selected-country-map').innerText = selectedCountryName;
            document.getElementById('selected-country-info').style.display = '';
            drawGraph('map-graph', selectedCountryName, selectedMapPurpose,
                `${mapStartYear}-${String(mapStartMonth).padStart(2,'0')}`,
                `${mapEndYear}-${String(mapEndMonth).padStart(2,'0')}`);
        });
        mapDiv.on('mousemove', function(ev){
            if(tooltip.style.display==='block'){
                tooltip.style.left = (ev.clientX+16) + 'px';
                tooltip.style.top = (ev.clientY+window.scrollY-10) + 'px';
            }
        });
    }

    // --------- 지도 탭 진입시에만 지도 렌더링 ---------
    document.getElementById('map-mode-tab').addEventListener('shown.bs.tab', function () {
        renderWorldMap();
    });

    // --------- 최초 진입: 메뉴탭만 실행 ---------
    document.addEventListener('DOMContentLoaded', function(){
        document.getElementById('search-btn').click();
    });
</script>
</body>
</html>
