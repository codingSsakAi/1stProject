<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입국자수 비교 예측 프로그램</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+KR:400,700&display=swap" rel="stylesheet">
</head>
<body>
<header class="p-3 bg-dark text-white mb-3">
    <div class="container"><h3 class="m-0">Precision Coach 갓갱 | 입국자수 비교 예측 프로그램</h3></div>
</header>
<div class="container">

    <div class="row mb-3">
        <!-- 국가1/목적1 -->
        <div class="col-md-2">
            <label class="form-label">국가1</label>
            <select class="form-select" id="country1"></select>
        </div>
        <div class="col-md-2">
            <label class="form-label">목적1</label>
            <select class="form-select" id="purpose1"></select>
        </div>
        <!-- 국가2/목적2 -->
        <div class="col-md-2">
            <label class="form-label">국가2</label>
            <select class="form-select" id="country2"></select>
        </div>
        <div class="col-md-2">
            <label class="form-label">목적2</label>
            <select class="form-select" id="purpose2"></select>
        </div>
        <!-- 기간 -->
        <div class="col-md-4 d-flex align-items-end">
            <select class="form-select w-auto me-1" id="start-year"></select>
            <select class="form-select w-auto me-1" id="start-month"></select>
            <span class="mx-1">~</span>
            <select class="form-select w-auto me-1" id="end-year"></select>
            <select class="form-select w-auto" id="end-month"></select>
            <button class="btn btn-primary ms-3" id="compare-btn">비교</button>
        </div>
    </div>

    <div class="mb-2 fs-5 fw-bold" id="compare-title"></div>
    <div id="compare-graph"></div>
</div>

<footer class="p-3 bg-light text-center mt-4">임시 풋터: Precision Coach 갓갱</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let countryList = [], purposeList = [];

function setSelectOptions(id, options, defaultValue, withNone) {
    let sel = document.getElementById(id);
    sel.innerHTML = '';
    if (withNone) {
        let opt = document.createElement('option');
        opt.value = "미선택";
        opt.text = "미선택";
        sel.appendChild(opt);
    }
    options.forEach(v=>{
        let opt = document.createElement('option');
        opt.value = v;
        opt.text = v;
        sel.appendChild(opt);
    });
    sel.value = defaultValue || options[0];
}

function setYearMonthSelect(sy, sm, ey, em, minY, minM, maxY, maxM) {
    let years = [];
    for (let y = minY; y <= maxY; y++) years.push(y);
    let months = [];
    for (let m = 1; m <= 12; m++) months.push(m);
    [sy, ey].forEach(id=>{
        let sel = document.getElementById(id);
        sel.innerHTML = '';
        years.forEach(y=>{
            let opt = document.createElement('option');
            opt.value = y;
            opt.text = y + '년';
            sel.appendChild(opt);
        });
    });
    [sm, em].forEach(id=>{
        let sel = document.getElementById(id);
        sel.innerHTML = '';
        months.forEach(m=>{
            let opt = document.createElement('option');
            opt.value = m;
            opt.text = m + '월';
            sel.appendChild(opt);
        });
    });
}

fetch('/api/countries').then(res=>res.json()).then(list=>{
    countryList = list;
    setSelectOptions('country1', countryList, countryList[0], false);
    setSelectOptions('country2', countryList, "미선택", true);
});
fetch('/api/purposes').then(res=>res.json()).then(list=>{
    purposeList = list;
    setSelectOptions('purpose1', purposeList, purposeList[0], false);
    setSelectOptions('purpose2', purposeList, "미선택", true);
});

// 실제 데이터 범위 가져와서 년월 셀렉트 설정(여기선 하드코딩 예시, 서버API화 권장)
const minYear = 2005, maxYear = 2025, minMonth = 1, maxMonth = 5;
setYearMonthSelect('start-year', 'start-month', 'end-year', 'end-month', minYear, minMonth, maxYear, maxMonth);

// 비교 버튼
document.getElementById('compare-btn').onclick = function(){
    let combos = [
        {country: document.getElementById('country1').value, purpose: document.getElementById('purpose1').value},
        {country: document.getElementById('country2').value, purpose: document.getElementById('purpose2').value}
    ];
    let startYear = parseInt(document.getElementById('start-year').value);
    let startMonth = parseInt(document.getElementById('start-month').value);
    let endYear = parseInt(document.getElementById('end-year').value);
    let endMonth = parseInt(document.getElementById('end-month').value);

    let startYM = `${startYear}-${String(startMonth).padStart(2,'0')}`;
    let endYM = `${endYear}-${String(endMonth).padStart(2,'0')}`;
    fetch('/api/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            combos: combos,
            start_ym: startYM,
            end_ym: endYM
        })
    }).then(res=>res.json()).then(res=>{
        let results = res.results;
        let traces = [];
        let titleParts = [];
        results.forEach((r, idx)=>{
            if (!r || r.error) return;
            let color = idx==0 ? '#2196f3' : '#ff9800';
            let label = `[${r.country}] [${r.purpose}]`;
            traces.push({
                x: r.yms,
                y: r.values,
                name: label,
                mode: 'lines+markers',
                line: {color: color, width: 3, dash: 'solid'},
                marker: {color: color, size: 10}
            });
            titleParts.push(label);
        });
        document.getElementById('compare-title').innerText = titleParts.join('  vs  ');
        Plotly.newPlot('compare-graph', traces, {
            xaxis: {title: '월', tickangle: -30},
            yaxis: {title: '입국자 수', rangemode: 'tozero', tickformat: ',d'},
            margin: { t:30, b:80, l:60, r:10 },
            legend: {orientation: "h", x:0.5, xanchor:"center"},
            font: {family: 'Noto Sans KR, Malgun Gothic, sans-serif'},
        }, {responsive: true});
    });
};

document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('compare-btn').click();
});
</script>
</body>
</html>
