<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Inbound Forecaster | 외국인 입국자 예측 서비스</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
    body, html { height: 100%; margin: 0; padding: 0; }
    .landing-bg {
        min-height: 100vh;
        width: 100vw;
        background:
          linear-gradient(rgba(20,30,40,0.52), rgba(12,18,32,0.58)),
          url('/static/images/경복궁.png') center center / cover no-repeat;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .landing-title {
        font-size: 2.7rem;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 2px 16px rgba(0,0,0,0.24);
        margin-bottom: 30px;
        letter-spacing: 1px;
    }
    .landing-desc {
        color: #f6faff;
        font-size: 1.12rem;
        max-width: 600px;
        margin: 0 auto 38px auto;
        line-height: 1.7;
        text-align: center;
        font-weight: 400;
        text-shadow: 0 2px 14px rgba(0,0,0,0.21);
    }
    .landing-btn {
        display: inline-block;
        font-size: 1.17rem;
        font-weight: bold;
        padding: 14px 50px;
        border-radius: 40px;
        background: #2563eb;
        border: none;
        color: #fff;
        box-shadow: 0 2px 16px rgba(41,48,85,0.13);
        transition: background .14s;
        margin-top: 10px;
        margin-bottom: 5px;
        text-align: center;
    }
    .landing-btn:hover { background: #1749a6; }
    @media (max-width: 700px) {
        .landing-title { font-size:2rem; }
        .landing-desc { font-size: 0.96rem; max-width:96vw;}
    }
    </style>
</head>
<body>
    <div class="landing-bg">
        <div>
            <div class="landing-title">Inbound Forecaster</div>
            <div class="landing-desc">
                팬데믹 이후 글로벌 관광 시장이 빠르게 회복되며,<br>
                한국 방문 외국인 입국자 수도 꾸준히 증가하고 있습니다.<br>
                입국 패턴은 다양한 요인에 따라 변동성이 커<br>
                정확한 예측이 정책과 산업 운영에 매우 중요합니다.<br>
                본 프로젝트는 딥러닝과 공공 데이터를 활용해<br>
                외국인 입국자 수를 예측하고, 데이터 기반 관광 전략을 지원합니다.
            </div>
            <button class="landing-btn" onclick="location.href='/predict'">예측 시작하기</button>
        </div>
    </div>
</body>
</html>
