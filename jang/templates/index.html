<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입국자수 비교 예측 프로그램</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
<div class="container py-4">
    <h2 class="mb-4">입국자수 비교 예측 프로그램</h2>
    <form id="predict-form">
        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label">국적</label>
                <select id="country1" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">목적</label>
                <select id="purpose1" class="form-select"></select>
            </div>
            <div class="col-md-2">
                <label class="form-label">시작</label>
                <input type="month" id="start-ym" class="form-control">
            </div>
            <div class="col-md-2">
                <label class="form-label">종료</label>
                <input type="month" id="end-ym" class="form-control">
            </div>
        </div>
        <div class="text-end">
            <button class="btn btn-primary" type="submit" id="predict-btn">예측 실행</button>
        </div>
    </form>
    <div id="graph-container" class="mt-5"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const predictForm    = document.getElementById('predict-form');
    const country1       = document.getElementById('country1');
    const purpose1       = document.getElementById('purpose1');
    const startYm        = document.getElementById('start-ym');
    const endYm          = document.getElementById('end-ym');
    const graphContainer = document.getElementById('graph-container');
    const predictBtn     = document.getElementById('predict-btn');

    fetch('/api/countries')
      .then(r => r.json())
      .then(arr => arr.forEach(v => country1.append(new Option(v, v))));

    fetch('/api/purposes')
      .then(r => r.json())
      .then(arr => arr.forEach(v => purpose1.append(new Option(v, v))));

    predictForm.addEventListener('submit', async e => {
        e.preventDefault();
        graphContainer.innerHTML = '';
        predictBtn.disabled = true;
        predictBtn.textContent = '예측중...';

        const country = country1.value;
        const purpose = purpose1.value;
        const start   = startYm.value;
        const end     = endYm.value;

        try {
            const res = await fetch('/api/predict', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    combos: [{ country, purpose }],
                    start_ym: start,
                    end_ym: end
                })
            });
            const { results } = await res.json();

            if (!results || results.length === 0) {
                const alert = document.createElement('div');
                alert.className = 'alert alert-warning';
                alert.textContent = '예측 결과가 없습니다.';
                graphContainer.append(alert);
            }

            results.forEach(r => {
                if (r.error) {
                    const alert = document.createElement('div');
                    alert.className = 'alert alert-danger';
                    alert.textContent = `[오류] ${r.error}`;
                    graphContainer.append(alert);
                    return;
                }

                // 그래프
                const graphDiv = document.createElement('div');
                graphDiv.style.height = '400px';
                graphContainer.append(graphDiv);

                Plotly.newPlot(graphDiv, [
                    {
                        x: r.hist_yms,
                        y: r.hist_values,
                        mode: 'lines+markers',
                        name: '실제값',
                        line: { dash: 'dot' },
                        marker: { size: 5 }
                    },
                    {
                        x: r.yms,
                        y: r.values,
                        mode: 'lines+markers',
                        name: '예측값',
                        marker: { size: 6 }
                    }
                ], {
                    title: `${r.country} / ${r.purpose} 입국자수`,
                    margin: { t: 50, b: 50 }
                });

                // 예측 수치 테이블
                const tableDiv = document.createElement('div');
                tableDiv.className = 'mt-3';
                tableDiv.innerHTML = `
                    <table class="table table-bordered table-sm">
                        <thead>
                            <tr><th>연월</th><th>예측 입국자수</th></tr>
                        </thead>
                        <tbody>
                            ${r.yms.map((ym,i) =>
                                `<tr><td>${ym}</td><td>${r.values[i]}</td></tr>`
                            ).join('')}
                        </tbody>
                    </table>
                `;
                graphContainer.append(tableDiv);

                // 성능 지표 표시
                const metricDiv = document.createElement('div');
                metricDiv.className = 'mb-4';
                metricDiv.innerHTML = `
                    <strong>성능 지표:</strong>
                    R² = ${r.r2 ?? '-'} |
                    MAPE = ${r.mape != null ? r.mape + '%' : '-'} |
                    신뢰도 = ${r.confidence != null ? r.confidence + '%' : '-'}
                `;
                graphContainer.append(metricDiv);
            });
        } catch (err) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger';
            alert.textContent = `[오류] 예측 실행 중 오류가 발생했습니다.`;
            graphContainer.append(alert);
        } finally {
            predictBtn.disabled = false;
            predictBtn.textContent = '예측 실행';
        }
    });
});
</script>
</body>
</html>
