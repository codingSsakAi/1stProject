<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>외국인 입국자 예측 및 뉴스</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>🌍 외국인 입국자 예측 시스템</h1>

    <div class="section">
        <h2>📅 예측 설정</h2>
        <form id="predict-form">
            <label>국적:
                <select id="country-select"></select>
            </label>
            <label>목적:
                <select id="purpose-select"></select>
            </label>
            <label>시작 연월:
                <input type="month" id="start-ym">
            </label>
            <label>종료 연월:
                <input type="month" id="end-ym">
            </label>
            <button type="submit">예측 실행</button>
        </form>
    </div>

    <div class="section" id="result-section" style="display:none;">
        <h2>📈 예측 결과</h2>
        <div id="result-list"></div>
    </div>

    <div class="section">
        <h2>📰 최근 한국 관련 뉴스</h2>
        <div id="news-container"></div>
        <button id="load-more-news">더 보기</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        let currentPage = 1;

        async function loadDropdowns() {
            const countries = await fetch('/api/countries').then(res => res.json());
            const purposes = await fetch('/api/purposes').then(res => res.json());

            const cSelect = document.getElementById('country-select');
            countries.forEach(c => {
                const option = document.createElement('option');
                option.value = c;
                option.textContent = c;
                cSelect.appendChild(option);
            });

            const pSelect = document.getElementById('purpose-select');
            purposes.forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                option.textContent = p;
                pSelect.appendChild(option);
            });
        }

        async function loadNews(page = 1) {
            const news = await fetch(`/api/news?page=${page}`).then(res => res.json());
            const container = document.getElementById('news-container');

            news.news.forEach(item => {
                const div = document.createElement('div');
                div.classList.add('news-item');
                div.innerHTML = `<a href="${item.link}" target="_blank"><strong>${item.title}</strong></a><br><small>${item.pubDate}</small><p>${item.description}</p>`;
                container.appendChild(div);
            });

            if (news.total <= page * news.page_size) {
                document.getElementById('load-more-news').style.display = 'none';
            }
        }

        document.getElementById('load-more-news').addEventListener('click', () => {
            currentPage++;
            loadNews(currentPage);
        });

        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const country = document.getElementById('country-select').value;
            const purpose = document.getElementById('purpose-select').value;
            const startYM = document.getElementById('start-ym').value;
            const endYM = document.getElementById('end-ym').value;

            const body = {
                combos: [{ country, purpose }],
                start_ym: startYM,
                end_ym: endYM
            };

            const res = await fetch('/api/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            }).then(r => r.json());

            const resultList = document.getElementById('result-list');
            resultList.innerHTML = '';

            res.results.forEach((r, idx) => {
                if (r.error) {
                    const errorP = document.createElement('p');
                    errorP.style.color = 'red';
                    errorP.textContent = r.error;
                    resultList.appendChild(errorP);
                } else {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'chart-block';
                    wrapper.style.marginBottom = '40px';

                    const title = document.createElement('h3');
                    title.textContent = `📌 ${r.country} / ${r.purpose}`;
                    wrapper.appendChild(title);

                    const list = document.createElement('div');
                    list.innerHTML = r.yms.map((ym, i) =>
                        `${ym}: ${r.values[i].toLocaleString()}명`).join('<br>');
                    wrapper.appendChild(list);

                    const canvas = document.createElement('canvas');
                    const canvasId = `forecastChart-${idx}`;
                    canvas.id = canvasId;
                    canvas.width = 800;
                    canvas.height = 300;
                    canvas.style.marginTop = '10px';
                    wrapper.appendChild(canvas);
                    resultList.appendChild(wrapper);

                    // 실제 + 예측 그래프
                    const labels = [...r.hist_yms, ...r.yms];
                    const actualLen = r.hist_yms.length;
                    const predictedLen = r.yms.length;

                    const ctx = canvas.getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: '📊 실제 입국자 수',
                                    data: r.hist_values,
                                    borderColor: 'gray',
                                    borderWidth: 2,
                                    fill: false,
                                    tension: 0.3
                                },
                                {
                                    label: '🔮 예측 입국자 수',
                                    data: Array(actualLen).fill(null).concat(r.values),
                                    borderColor: 'rgba(54, 162, 235, 1)',
                                    borderWidth: 2,
                                    borderDash: [5, 5],
                                    fill: false,
                                    tension: 0.3
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            scales: {
                                x: {
                                    title: { display: true, text: '연월' }
                                },
                                y: {
                                    title: { display: true, text: '입국자 수' },
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
            });

            document.getElementById('result-section').style.display = 'block';
        });

        loadDropdowns();
        loadNews();
    </script>
</body>
</html>
