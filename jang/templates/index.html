<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입국자수 비교 예측 프로그램</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
<div class="container py-4">
    <h2 class="mb-4">입국자수 비교 예측 프로그램</h2>

    <form id="predict-form">
        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label">국적</label>
                <select class="form-select" id="country1"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label">목적</label>
                <select class="form-select" id="purpose1"></select>
            </div>
            <div class="col-md-2">
                <label class="form-label">시작 연도</label>
                <input type="number" class="form-control" id="start-year" placeholder="2026">
            </div>
            <div class="col-md-2">
                <label class="form-label">시작 월</label>
                <input type="number" class="form-control" id="start-month" placeholder="1">
            </div>
            <div class="col-md-2">
                <label class="form-label">종료 연도</label>
                <input type="number" class="form-control" id="end-year" placeholder="2026">
            </div>
            <div class="col-md-2">
                <label class="form-label">종료 월</label>
                <input type="number" class="form-control" id="end-month" placeholder="12">
            </div>
        </div>
        <div class="text-end">
            <button type="submit" class="btn btn-primary">예측 실행</button>
        </div>
    </form>

    <div class="mt-5" id="graph-container"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/countries').then(res => res.json()).then(data => {
        const sel = document.getElementById('country1');
        data.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            sel.appendChild(opt);
        });
    });

    fetch('/api/purposes').then(res => res.json()).then(data => {
        const sel = document.getElementById('purpose1');
        data.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            sel.appendChild(opt);
        });
    });

    document.getElementById('predict-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const country = document.getElementById('country1').value;
        const purpose = document.getElementById('purpose1').value;
        const startYM = `${document.getElementById('start-year').value}-${String(document.getElementById('start-month').value).padStart(2, '0')}`;
        const endYM = `${document.getElementById('end-year').value}-${String(document.getElementById('end-month').value).padStart(2, '0')}`;

        const res = await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                combos: [{ country, purpose }],
                start_ym: startYM,
                end_ym: endYM
            })
        });

        const data = await res.json();
        const container = document.getElementById('graph-container');
        container.innerHTML = '';

        data.results.forEach(result => {
            if (result.error) {
                const div = document.createElement('div');
                div.classList.add('alert', 'alert-danger');
                div.textContent = `[오류] ${result.error}`;
                container.appendChild(div);
                return;
            }

            const title = `${result.country} / ${result.purpose} 입국자수`;
            const trace1 = {
                x: result.hist_yms,
                y: result.hist_values,
                mode: 'lines+markers',
                name: '실제값',
                line: { dash: 'dot', color: 'gray' },
                marker: { size: 5 }
            };

            const trace2 = {
                x: result.yms,
                y: result.values,
                mode: 'lines+markers',
                name: '예측값',
                line: { color: 'blue', width: 3 },
                marker: { color: 'blue', size: 6 }
            };

            const graphDiv = document.createElement('div');
            graphDiv.style.height = '450px';
            container.appendChild(graphDiv);

            Plotly.newPlot(graphDiv, [trace1, trace2], {
                title: title,
                font: { size: 14 },
                margin: { t: 60, l: 50, r: 30, b: 50 }
            });

            // 수치 테이블 표시
            const tableDiv = document.createElement('div');
            const tableHTML = `
                <table class="table table-bordered table-sm mt-3">
                    <thead><tr><th>연월</th><th>예측 입국자수</th></tr></thead>
                    <tbody>
                        ${result.yms.map((ym, i) => `<tr><td>${ym}</td><td>${result.values[i]}</td></tr>`).join('')}
                    </tbody>
                </table>
            `;
            tableDiv.innerHTML = tableHTML;
            container.appendChild(tableDiv);
        });
    });
});
</script>
</body>
</html>
